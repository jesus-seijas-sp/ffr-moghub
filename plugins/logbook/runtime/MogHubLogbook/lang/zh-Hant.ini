plugin.name = MogHub Logbook
plugin.description = 在一個地方查看你的進度，主選單中有專屬入口：每個區域的寶箱和道具（已找到的，以及其餘的內容），支線任務及目前目標，競技場戰鬥，以及每塊石板碎片的位置。只讀取遊戲，不做任何更改。
