plugin.name = MogHub Logbook
plugin.description = 진행 상황을 한곳에서, 메인 메뉴의 전용 항목으로: 각 지역의 보물상자와 아이템(찾은 것과 남은 것의 내용물), 서브 스토리와 현재 목표, 콜로세움 배틀, 석판 조각의 위치. 플레이 중인 게임을 읽기만 하며 아무것도 바꾸지 않습니다.
