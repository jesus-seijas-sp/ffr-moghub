plugin.name = MogHub Logbook
plugin.description = あなたの進行状況をひとつの画面に。メインメニューに専用の項目があります：各エリアの宝箱とアイテム（入手済みと、残りの中身）、サブストーリーと現在の目的、闘技場のバトル、石板のカケラの場所。プレイ中のゲームを読み取るだけで、何も変更しません。
