; MogHub Logbook: de

plugin.name = MogHub Logbook
plugin.description = Dein Fortschritt an einem Ort, mit eigenem Eintrag im Hauptmenü: die Schatztruhen und Gegenstände jedes Gebiets (gefunden, und was die übrigen enthalten), Nebenquests mit ihrem aktuellen Ziel, die Kämpfe im Kolosseum und wo jedes Tafelfragment liegt. Es liest dein Spiel, während du spielst, und ändert nichts.
