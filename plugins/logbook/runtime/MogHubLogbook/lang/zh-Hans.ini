plugin.name = MogHub Logbook
plugin.description = 在一个地方查看你的进度，主菜单中有专属入口：每个区域的宝箱和道具（已找到的，以及其余的内容），支线任务及当前目标，竞技场战斗，以及每块石板碎片的位置。只读取游戏，不做任何更改。
