; MogHub Logbook: fr

plugin.name = MogHub Logbook
plugin.description = Votre progression en un seul endroit, avec sa propre entrée dans le menu principal : les coffres et objets de chaque zone (trouvés, et ce que contiennent les autres), les quêtes annexes avec leur objectif actuel, les combats du Colisée et l'emplacement de chaque fragment de tablette. Il lit votre partie pendant que vous jouez, sans rien modifier.
