plugin.name = MogHub Logbook
plugin.description = Your progress in one place, in its own main-menu entry: every area's treasure chests and item spots (found, and what the others hold), side quests with their current goal, Colosseum battles and where every tablet shard is. It reads your game as you play, nothing is changed.
screen.title = Logbook
ShowContents.label = Show what's left to find
ShowContents.help = In an area's list, unopened chests and item spots not picked up yet show what they hold. Off: they show ??? until you find them.
ShowLocked.label = Show quests not available yet
ShowLocked.help = Side quests that open later in the story are listed by name. Off: they show as ???.

