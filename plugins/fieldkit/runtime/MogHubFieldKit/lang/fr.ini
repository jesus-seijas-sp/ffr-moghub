; MogHub Field Kit: fr

plugin.name = MogHub Field Kit
plugin.description = Du confort sur le terrain et à l'écran, chaque option avec son interrupteur : masquer la mini-carte, les quêtes ou le guide des touches (ou toute l'interface avec un raccourci), une jauge de combats, sauvegarder depuis le menu système n'importe où, des voix de combat plus discrètes, passer les logos d'introduction et des récompenses quand vous fuyez après avoir vaincu un ennemi.
header.HUD = Interface
HideMinimap.label = Masquer la mini-carte
HideMinimap.help = Masque la mini-carte en haut à droite. La carte reste accessible.
HideQuestTracker.label = Masquer les quêtes
HideQuestTracker.help = Masque le chapitre et l'objectif en cours en haut à gauche. Le menu Quêtes les affiche toujours.
HideKeyGuide.label = Masquer le guide des touches
HideKeyGuide.help = Masque la liste des touches à gauche (Enfourcher le chocobo, Mappemonde, Quêtes...). Les touches fonctionnent toujours.
HideHUD.label = Masquer toute l'interface
HideHUD.help = Masque tout ce qui s'affiche par-dessus le terrain, pour des captures ou un écran épuré. Raccourci : Ctrl+F7.
header.Field = Terrain
EncounterMeter.label = Jauge de combats
EncounterMeter.help = Affiche sous la mini-carte où vous en êtes avant le prochain combat aléatoire. Raccourci : Ctrl+F8.
SaveAnywhere.label = Sauvegarder partout
SaveAnywhere.help = Sauvegarder dans le menu système (Échap) fonctionne partout, pas seulement aux points de sauvegarde et sur la mappemonde. Jamais pendant les combats ni les scènes de l'histoire.
header.Battle = Combat
QuietVoices.label = Voix de combat plus discrètes
QuietVoices.help = Fait taire les répliques que les personnages répètent sans cesse : au début de chaque tour, à l'ouverture des menus de compétences et Ex, et au début et à la fin des combats. Les cris de compétence, les réactions et les voix de l'histoire restent.
QuietVoices.choice.off = Non
QuietVoices.choice.turn = Début de tour
QuietVoices.choice.menus = Début de tour et menus
QuietVoices.choice.more = Aussi début et victoire
EscapeRewards.label = Récompenses de fuite
EscapeRewards.help = Fuir un combat après avoir vaincu au moins un ennemi rapporte quand même les EXP et les gils des ennemis vaincus.
header.Start-up = Démarrage
SkipLogos.label = Passer les logos d'introduction
SkipLogos.help = Les logos affichés au lancement du jeu défilent aussitôt. Prend effet au prochain lancement du jeu.
escapeRewards = Récompenses de fuite : {1} EXP, {2} gils
meter = Prochain combat : {1} %
