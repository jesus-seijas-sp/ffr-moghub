; MogHub Field Kit: zh-Hans

plugin.name = MogHub Field Kit
plugin.description = 野外与界面的便利功能（每项单独开关）：隐藏小地图、任务或按键指引（也可用快捷键隐藏整个界面），遇敌计量表，随处从系统菜单存档，减少战斗语音，跳过开场标志，击败敌人后逃跑也能获得奖励。
header.HUD = 界面
HideMinimap.label = 隐藏小地图
HideMinimap.help = 隐藏右上角的小地图。地图画面照常可用。
HideQuestTracker.label = 隐藏任务显示
HideQuestTracker.help = 隐藏左上角的章节和当前目标。任务菜单中仍可查看。
HideKeyGuide.label = 隐藏按键指引
HideKeyGuide.help = 隐藏左侧的按键列表（骑乘陆行鸟、世界地图、任务……）。按键照常有效。
HideHUD.label = 隐藏整个界面
HideHUD.help = 隐藏野外画面上显示的所有内容，用于截图或保持画面整洁。快捷键：Ctrl+F7。
header.Field = 野外
EncounterMeter.label = 遇敌计量表
EncounterMeter.help = 在小地图下方显示距离下一次随机遇敌还有多远。快捷键：Ctrl+F8。
SaveAnywhere.label = 随处存档
SaveAnywhere.help = 系统菜单（Esc）中的存档在任何地方都可使用，不再限于存档点和世界地图。战斗中和剧情场景中仍不可用。
header.Battle = 战斗
QuietVoices.label = 减少战斗语音
QuietVoices.help = 关闭角色反复说的台词：每个回合开始时、打开技能和Ex菜单时，以及战斗开始和结束时。技能喊声、受击反应和剧情语音保留。
QuietVoices.choice.off = 关
QuietVoices.choice.turn = 回合开始
QuietVoices.choice.menus = 回合开始和菜单
QuietVoices.choice.more = 也包括战斗开始和胜利
EscapeRewards.label = 逃跑奖励
EscapeRewards.help = 击败至少一个敌人后从战斗中逃跑，仍可获得被击败敌人的经验值和金币。
header.Start-up = 启动
SkipLogos.label = 跳过开场标志
SkipLogos.help = 游戏启动时的标志一闪而过。下次启动游戏时生效。
escapeRewards = 逃跑奖励：{1} 经验值，{2} 金币
meter = 距下一场战斗：{1}%
