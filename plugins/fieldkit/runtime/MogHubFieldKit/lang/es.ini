; MogHub Field Kit: es

plugin.name = MogHub Field Kit
plugin.description = Comodidades para el campo y la interfaz, cada una con su interruptor: ocultar el minimapa, las misiones o la guía de teclas (o toda la interfaz con un atajo), un medidor de encuentros, guardar desde el menú de pausa en cualquier lugar, voces de batalla más discretas, saltar los logotipos iniciales y recompensas al huir tras derrotar a un enemigo.
header.HUD = Interfaz
HideMinimap.label = Ocultar minimapa
HideMinimap.help = Oculta el minimapa de la esquina superior derecha. El mapa sigue funcionando.
HideQuestTracker.label = Ocultar misiones
HideQuestTracker.help = Oculta el capítulo y el objetivo actual de la esquina superior izquierda. El menú Misiones los sigue mostrando.
HideKeyGuide.label = Ocultar guía de teclas
HideKeyGuide.help = Oculta la lista de teclas de la izquierda (Montar chocobo, Mapamundi, Misiones...). Las teclas siguen funcionando.
HideHUD.label = Ocultar toda la interfaz
HideHUD.help = Oculta todo lo que se dibuja sobre el campo, para capturas o una pantalla limpia. Atajo: Ctrl+F7.
header.Field = Campo
EncounterMeter.label = Medidor de encuentros
EncounterMeter.help = Muestra, bajo el minimapa, cuánto falta para el siguiente encuentro aleatorio. Atajo: Ctrl+F8.
SaveAnywhere.label = Guardar en cualquier lugar
SaveAnywhere.help = Guardar en el menú de pausa (Esc) funciona en todas partes, no solo en los puntos de guardado y en el mapamundi. Nunca durante batallas ni escenas de la historia.
header.Battle = Batalla
QuietVoices.label = Voces de batalla más discretas
QuietVoices.help = Silencia las frases que los personajes repiten una y otra vez: al empezar cada turno, al abrir los menús de habilidades y Ex, y al empezar y terminar las batallas. Los gritos de habilidad, las reacciones y las voces de la historia se mantienen.
QuietVoices.choice.off = No
QuietVoices.choice.turn = Inicio de turno
QuietVoices.choice.menus = Inicio de turno y menús
QuietVoices.choice.more = También inicio y victoria
EscapeRewards.label = Recompensas al huir
EscapeRewards.help = Huir de una batalla después de derrotar al menos a un enemigo sigue dando los EXP y guiles de los enemigos derrotados.
header.Start-up = Inicio del juego
SkipLogos.label = Saltar logotipos iniciales
SkipLogos.help = Los logotipos que aparecen al iniciar el juego pasan al instante. Se aplica la próxima vez que se inicie el juego.
escapeRewards = Recompensas al huir: {1} EXP, {2} guiles
meter = Siguiente batalla: {1}%
