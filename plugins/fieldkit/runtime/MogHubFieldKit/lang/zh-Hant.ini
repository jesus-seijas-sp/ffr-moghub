; MogHub Field Kit: zh-Hant

plugin.name = MogHub Field Kit
plugin.description = 野外與介面的便利功能（每項各自開關）：隱藏小地圖、任務或按鍵指引（也可用快捷鍵隱藏整個介面），遇敵計量表，隨處從系統選單存檔，減少戰鬥語音，跳過開場標誌，擊敗敵人後逃跑也能獲得獎勵。
header.HUD = 介面
HideMinimap.label = 隱藏小地圖
HideMinimap.help = 隱藏右上角的小地圖。地圖畫面照常可用。
HideQuestTracker.label = 隱藏任務顯示
HideQuestTracker.help = 隱藏左上角的章節與目前目標。任務選單中仍可查看。
HideKeyGuide.label = 隱藏按鍵指引
HideKeyGuide.help = 隱藏左側的按鍵清單（騎乘陸行鳥、世界地圖、任務……）。按鍵照常有效。
HideHUD.label = 隱藏整個介面
HideHUD.help = 隱藏野外畫面上顯示的所有內容，用於截圖或保持畫面整潔。快捷鍵：Ctrl+F7。
header.Field = 野外
EncounterMeter.label = 遇敵計量表
EncounterMeter.help = 在小地圖下方顯示距離下一次隨機遇敵還有多遠。快捷鍵：Ctrl+F8。
SaveAnywhere.label = 隨處存檔
SaveAnywhere.help = 系統選單（Esc）中的存檔在任何地方都可使用，不再限於存檔點與世界地圖。戰鬥中與劇情場景中仍不可用。
header.Battle = 戰鬥
QuietVoices.label = 減少戰鬥語音
QuietVoices.help = 關閉角色反覆說的台詞：每個回合開始時、開啟技能與Ex選單時，以及戰鬥開始與結束時。技能喊聲、受擊反應與劇情語音保留。
QuietVoices.choice.off = 關
QuietVoices.choice.turn = 回合開始
QuietVoices.choice.menus = 回合開始與選單
QuietVoices.choice.more = 也包括戰鬥開始與勝利
EscapeRewards.label = 逃跑獎勵
EscapeRewards.help = 擊敗至少一個敵人後從戰鬥中逃跑，仍可獲得被擊敗敵人的EXP與GIL。
header.Start-up = 啟動
SkipLogos.label = 跳過開場標誌
SkipLogos.help = 遊戲啟動時的標誌一閃而過。下次啟動遊戲時生效。
escapeRewards = 逃跑獎勵：{1} EXP，{2} GIL
meter = 距下一場戰鬥：{1}%
