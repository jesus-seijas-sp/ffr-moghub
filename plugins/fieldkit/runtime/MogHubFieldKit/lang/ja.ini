; MogHub Field Kit: ja

plugin.name = MogHub Field Kit
plugin.description = フィールドとHUDの便利機能（それぞれ個別にON/OFF）：ミニマップ・クエスト・キーガイドの非表示（ホットキーでHUD全体も）、エンカウントメーター、どこでもシステムメニューからセーブ、バトルボイスの抑制、起動時ロゴのスキップ、敵を倒した後に逃げても報酬を獲得。
header.HUD = HUD
HideMinimap.label = ミニマップを隠す
HideMinimap.help = 右上のミニマップを非表示にする。マップ画面はそのまま使える。
HideQuestTracker.label = クエスト表示を隠す
HideQuestTracker.help = 左上の章と現在の目的を非表示にする。クエストメニューでは引き続き確認できる。
HideKeyGuide.label = キーガイドを隠す
HideKeyGuide.help = 左側のキー一覧（チョコボに乗る、世界地図、クエスト…）を非表示にする。キー操作はそのまま使える。
HideHUD.label = HUDをすべて隠す
HideHUD.help = フィールド上の表示をすべて隠す。スクリーンショットやすっきりした画面に。ホットキー：Ctrl+F7
header.Field = フィールド
EncounterMeter.label = エンカウントメーター
EncounterMeter.help = 次のランダムエンカウントまでの進み具合をミニマップの下に表示する。ホットキー：Ctrl+F8
SaveAnywhere.label = どこでもセーブ
SaveAnywhere.help = システムメニュー（Esc）のセーブがセーブポイントや世界地図以外でも使えるようになる。バトル中とイベントシーン中は不可。
header.Battle = バトル
QuietVoices.label = バトルボイスを控えめに
QuietVoices.help = キャラクターが何度も繰り返すボイスを消す：ターン開始時、スキル・Exメニューを開いたとき、バトル開始時と終了時。スキル発動時の掛け声、リアクション、ストーリーのボイスはそのまま。
QuietVoices.choice.off = OFF
QuietVoices.choice.turn = ターン開始
QuietVoices.choice.menus = ターン開始とメニュー
QuietVoices.choice.more = バトル開始と勝利時も
EscapeRewards.label = 逃走時の報酬
EscapeRewards.help = 敵を1体以上倒してからバトルから逃げても、倒した敵のEXPとギルを獲得できる。
header.Start-up = 起動
SkipLogos.label = 起動時のロゴをスキップ
SkipLogos.help = ゲーム起動時のロゴが一瞬で過ぎる。次回のゲーム起動時から有効。
escapeRewards = 逃走時の報酬：{1} EXP、{2} ギル
meter = 次のバトルまで：{1}%
