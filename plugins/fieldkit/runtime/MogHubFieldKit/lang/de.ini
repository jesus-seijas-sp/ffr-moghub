; MogHub Field Kit: de

plugin.name = MogHub Field Kit
plugin.description = Komfort auf dem Feld und im HUD, jeweils mit eigenem Schalter: Minikarte, Aufträge oder Tastenhilfe ausblenden (oder das ganze HUD per Tastenkürzel), eine Begegnungsanzeige, überall über das Systemmenü speichern, leisere Kampfstimmen, Intro-Logos überspringen und Belohnungen, wenn du nach einem besiegten Gegner fliehst.
header.HUD = HUD
HideMinimap.label = Minikarte ausblenden
HideMinimap.help = Blendet die Minikarte oben rechts aus. Die Karte funktioniert weiterhin.
HideQuestTracker.label = Aufträge ausblenden
HideQuestTracker.help = Blendet Kapitel und aktuelles Ziel oben links aus. Das Menü Aufträge zeigt sie weiterhin an.
HideKeyGuide.label = Tastenhilfe ausblenden
HideKeyGuide.help = Blendet die Liste der Feldtasten links aus (Aufsitzen, Weltkarte, Aufträge...). Die Tasten funktionieren weiterhin.
HideHUD.label = Ganzes HUD ausblenden
HideHUD.help = Blendet alles aus, was über dem Feld angezeigt wird, für Screenshots oder ein freies Bild. Tastenkürzel: Ctrl+F7.
header.Field = Feld
EncounterMeter.label = Begegnungsanzeige
EncounterMeter.help = Zeigt unter der Minikarte, wie weit es bis zum nächsten Zufallskampf ist. Tastenkürzel: Ctrl+F8.
SaveAnywhere.label = Überall speichern
SaveAnywhere.help = Speichern im Systemmenü (Esc) funktioniert überall, nicht nur an Speicherpunkten und auf der Weltkarte. Nie während Kämpfen oder Story-Szenen.
header.Battle = Kampf
QuietVoices.label = Leisere Kampfstimmen
QuietVoices.help = Schaltet die Sätze stumm, die die Figuren immer wieder sagen: zu Beginn jedes Zuges, beim Öffnen der Fähigkeiten- und Ex-Menüs sowie zu Beginn und Ende von Kämpfen. Fähigkeitsrufe, Reaktionen und Story-Stimmen bleiben.
QuietVoices.choice.off = Aus
QuietVoices.choice.turn = Zugbeginn
QuietVoices.choice.menus = Zugbeginn und Menüs
QuietVoices.choice.more = Auch Kampfbeginn und Sieg
EscapeRewards.label = Belohnung bei Flucht
EscapeRewards.help = Wer nach mindestens einem besiegten Gegner aus dem Kampf flieht, erhält trotzdem die EP und Gil der besiegten Gegner.
header.Start-up = Spielstart
SkipLogos.label = Intro-Logos überspringen
SkipLogos.help = Die Logos beim Spielstart ziehen sofort vorbei. Wirkt ab dem nächsten Spielstart.
escapeRewards = Belohnung bei Flucht: {1} EP, {2} Gil
meter = Nächster Kampf: {1} %
