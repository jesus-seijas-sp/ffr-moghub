; MogHub Field Kit: ko

plugin.name = MogHub Field Kit
plugin.description = 필드와 HUD 편의 기능(각각 개별 ON/OFF): 미니맵·퀘스트·키 가이드 숨기기(단축키로 HUD 전체도), 인카운트 미터, 어디서나 시스템 메뉴에서 세이브, 배틀 보이스 줄이기, 시작 로고 건너뛰기, 적을 쓰러뜨린 뒤 도주해도 보상 획득.
header.HUD = HUD
HideMinimap.label = 미니맵 숨기기
HideMinimap.help = 오른쪽 위의 미니맵을 숨긴다. 맵 화면은 그대로 쓸 수 있다.
HideQuestTracker.label = 퀘스트 표시 숨기기
HideQuestTracker.help = 왼쪽 위의 챕터와 현재 목표를 숨긴다. 퀘스트 메뉴에서는 계속 확인할 수 있다.
HideKeyGuide.label = 키 가이드 숨기기
HideKeyGuide.help = 왼쪽의 키 목록(초코보에 타기, 세계 지도, 퀘스트...)을 숨긴다. 키는 그대로 작동한다.
HideHUD.label = HUD 전체 숨기기
HideHUD.help = 필드 위에 표시되는 모든 것을 숨긴다. 스크린샷이나 깔끔한 화면용. 단축키: Ctrl+F7.
header.Field = 필드
EncounterMeter.label = 인카운트 미터
EncounterMeter.help = 다음 랜덤 인카운트까지 얼마나 남았는지 미니맵 아래에 표시한다. 단축키: Ctrl+F8.
SaveAnywhere.label = 어디서나 세이브
SaveAnywhere.help = 시스템 메뉴(Esc)의 세이브를 세이브 포인트와 세계 지도뿐 아니라 어디서나 쓸 수 있다. 배틀 중과 스토리 장면 중에는 불가.
header.Battle = 배틀
QuietVoices.label = 배틀 보이스 줄이기
QuietVoices.help = 캐릭터가 계속 반복하는 대사를 끈다: 매 턴 시작 시, 스킬·Ex 메뉴를 열 때, 배틀 시작과 종료 시. 스킬 기합, 리액션, 스토리 보이스는 그대로.
QuietVoices.choice.off = OFF
QuietVoices.choice.turn = 턴 시작
QuietVoices.choice.menus = 턴 시작과 메뉴
QuietVoices.choice.more = 배틀 시작과 승리 시도
EscapeRewards.label = 도주 보상
EscapeRewards.help = 적을 1체 이상 쓰러뜨린 뒤 배틀에서 도주해도 쓰러뜨린 적의 EXP와 길을 얻는다.
header.Start-up = 시작
SkipLogos.label = 시작 로고 건너뛰기
SkipLogos.help = 게임 시작 시 나오는 로고가 바로 지나간다. 다음 게임 시작부터 적용된다.
escapeRewards = 도주 보상: {1} EXP, {2} 길
meter = 다음 배틀까지: {1}%
