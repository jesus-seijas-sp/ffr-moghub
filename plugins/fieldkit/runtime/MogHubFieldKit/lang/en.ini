; --- name and settings ---
plugin.name = MogHub Field Kit
plugin.description = Field and HUD comforts, each one a switch: hide the minimap, quest tracker or key guide (or the whole HUD with a hotkey), an encounter meter, save from the system menu anywhere, quieter battle voices, skip the intro logos, and rewards when you flee after a kill.
header.HUD = HUD
HideMinimap.label = Hide minimap
HideMinimap.help = Hides the minimap in the top-right corner. The map screen still works.
HideQuestTracker.label = Hide quest tracker
HideQuestTracker.help = Hides the chapter and current goal in the top-left corner. The Quests menu still shows them.
HideKeyGuide.label = Hide key guide
HideKeyGuide.help = Hides the list of field keys on the left (Mount Chocobo, World Map, Quests...). The keys keep working.
HideHUD.label = Hide the whole HUD
HideHUD.help = Hides everything drawn over the field, for screenshots or a clean screen. Hotkey: Ctrl+F7.
header.Field = Field
EncounterMeter.label = Encounter meter
EncounterMeter.help = Shows how far you are from the next random battle, under the minimap. Hotkey: Ctrl+F8.
SaveAnywhere.label = Save anywhere
SaveAnywhere.help = Save in the system menu (Esc) works everywhere, not only at save points and on the world map. Never during battles or story scenes.
header.Battle = Battle
QuietVoices.label = Quieter battle voices
QuietVoices.help = Silences the lines characters say over and over: at the start of each turn, when opening the skill and Ex menus, and at the start and end of battles. Skill shouts, reactions and story voices stay.
QuietVoices.choice.off = Off
QuietVoices.choice.turn = Turn start
QuietVoices.choice.menus = Turn start and menus
QuietVoices.choice.more = Also battle start and victory
EscapeRewards.label = Escape rewards
EscapeRewards.help = Fleeing a battle after defeating at least one enemy still gives the EXP and Gil of the enemies you defeated.
header.Start-up = Start-up
SkipLogos.label = Skip intro logos
SkipLogos.help = The logos shown when the game starts go by at once. Takes effect the next time the game starts.

; --- messages ---
escapeRewards = Escape rewards: {1} EXP, {2} Gil
meter = Next battle: {1}%
