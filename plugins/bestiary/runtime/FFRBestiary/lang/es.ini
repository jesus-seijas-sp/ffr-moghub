; FFR Bestiary - Spanish texts, translated from en.ini. Corrections welcome.

; --- name and settings ---
plugin.name = FFR Bestiary
plugin.description = Un bestiario en el menú principal: todos los enemigos que has encontrado, agrupados por zona, con los datos de Libra del propio juego una vez analizados, su sprite de batalla animado y dónde encontrarlos.
screen.title = Bestiario
ShowAll.label = Mostrar todos los monstruos
ShowAll.help = Muestra cada monstruo en todas las zonas donde aparece, también los que aún no has encontrado (atenuados y con sus datos ocultos hasta que los analices o actives Libra para ellos). Los recuentos de Encontrados y Analizados siguen reflejando lo que has encontrado de verdad.
AreaLevels.label = Niveles de los enemigos por zona
AreaLevels.help = El intervalo de niveles de los encuentros de una zona (sin contar los jefes), en su panel del Bestiario. Las ciudades y las cuevas cuyos enemigos esperan en el mapa no tienen.
header.Libra = Libra
LibraPlus.label = Libra+
LibraPlus.help = Los datos exactos que el análisis del juego no muestra: cuánto resiste un monstruo cada estado alterado y la probabilidad de cada botín y de que un robo funcione.
LibraAll.label = Libra en todos los monstruos
LibraAll.help = Se muestran los datos de todos los monstruos, como si los hubieras analizado con Libra, sin modificar tu partida guardada. Un monstruo que hayas desactivado a mano (con Confirmar sobre él en el Bestiario) sigue desactivado.
Libra by hand.label = Libra a mano
Libra by hand.help = En el Bestiario, Confirmar sobre un monstruo activa o desactiva su Libra (datos de análisis), diga lo que diga el juego. Esto olvida todas esas elecciones.
Libra by hand.button = Olvidar todo
Libra by hand.done = Elecciones de Libra olvidadas

