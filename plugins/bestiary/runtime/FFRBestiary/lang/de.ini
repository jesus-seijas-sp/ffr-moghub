; FFR Bestiary - German texts, translated from en.ini. Corrections welcome.

; --- name and settings ---
plugin.name = FFR Bestiary
plugin.description = Ein Bestiarium im Hauptmenü: alle Gegner, denen du begegnet bist, nach Gebieten geordnet, mit den Analyse-Daten des Spiels, sobald du sie analysiert hast, ihrem animierten Kampf-Sprite und ihren Fundorten.
screen.title = Bestiarium
ShowAll.label = Alle Monster zeigen
ShowAll.help = Listet jedes Monster in allen Gebieten auf, in denen es vorkommt, auch solche, denen du noch nicht begegnet bist (abgedunkelt, ihre Analyse-Daten verborgen, bis du sie analysierst oder Analyse für sie einschaltest). Die Zähler „Begegnet“ und „Analysiert“ zeigen weiterhin, was du wirklich getroffen hast.
AreaLevels.label = Gegnerstufen je Gebiet
AreaLevels.help = Die Stufenspanne der Zufallsbegegnungen eines Gebiets (ohne Bosse), in seinem Feld im Bestiarium. Städte und Höhlen, deren Gegner auf der Karte warten, haben keine.
header.Libra = Analyse
LibraPlus.label = Analyse+
LibraPlus.help = Genaue Werte, die die Analyse des Spiels nicht zeigt: wie stark ein Monster jedem Zustand widersteht und wie hoch die Chance jeder Belohnung und eines erfolgreichen Diebstahls ist.
LibraAll.label = Analyse für alle Monster
LibraAll.help = Die Analyse-Daten jedes Monsters werden angezeigt, als hättest du es mit Analyse untersucht, ohne deinen Spielstand zu ändern. Ein Monster, das du von Hand ausgeschaltet hast (mit Bestätigen im Bestiarium), bleibt aus.
Libra by hand.label = Analyse von Hand
Libra by hand.help = Im Bestiarium schaltet Bestätigen auf einem Monster seine Analyse (Analyse-Daten) an oder aus, egal was das Spiel sagt. Hiermit werden alle diese Einstellungen vergessen.
Libra by hand.button = Alle vergessen
Libra by hand.done = Analyse-Einstellungen vergessen

