; --- name and settings ---
plugin.name = FFR Bestiary
plugin.description = A bestiary in the main menu: every enemy you have met, grouped by area, with the game's own scan (Libra) details once you have scanned it, its animated battle sprite, and where it can be found.
screen.title = Bestiary
ShowAll.label = Show all monsters
ShowAll.help = List every monster under all the areas it appears in, also the ones you haven't met yet (dimmed, with their scan data hidden until you scan them or switch Libra on for them). The Encountered and Scanned counts stay what you really met.
AreaLevels.label = Area enemy levels
AreaLevels.help = The level range of an area's random encounters (bosses left out), in its panel in the Bestiary. Towns, and caves whose enemies wait on the map, have none.
header.Libra = Libra
LibraPlus.label = Libra+
LibraPlus.help = Exact numbers the game's scan leaves out: how much a monster resists each status, and the chance of each drop and of a steal working.
LibraAll.label = Libra on every monster
LibraAll.help = Every monster's scan data shows, as if you had scanned it with Libra, without changing your save. A monster you switched off by hand (confirm on it in the Bestiary) stays off.
Libra by hand.label = Libra by hand
Libra by hand.help = In the Bestiary, confirm on a monster switches its Libra (scan data) on or off, whatever the game says. This forgets every such choice.
Libra by hand.button = Forget all
Libra by hand.done = Libra choices forgotten

