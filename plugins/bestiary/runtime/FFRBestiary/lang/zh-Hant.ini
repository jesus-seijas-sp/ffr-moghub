; FFR Bestiary - Traditional Chinese texts, translated from en.ini. Corrections welcome.

; --- name and settings ---
plugin.name = FFR Bestiary
plugin.description = 主選單中的怪物圖鑑：依區域列出你遇過的所有敵人，使用窺伺探測後會顯示遊戲本身的探測資料，並附上戰鬥中的動態圖像及出沒地點。
screen.title = 怪物圖鑑
ShowAll.label = 顯示所有怪物
ShowAll.help = 在每個出沒區域下列出所有怪物，包括尚未遇到的怪物（以暗色顯示，探測資料會隱藏，直到你探測該怪物或為其開啟窺伺探測）。「已遭遇」與「已探測」的數量仍只計算你實際遇到的怪物。
AreaLevels.label = 區域敵人等級
AreaLevels.help = 在怪物圖鑑的區域資訊中顯示該區域遇敵時敵人的等級範圍（不含頭目）。城鎮以及敵人在地圖上等待的洞窟沒有此項。
header.Libra = 窺伺探測
LibraPlus.label = 窺伺探測+
LibraPlus.help = 顯示遊戲窺伺探測中未顯示的精確數值：怪物對各種狀態異常的抗性，以及各項掉落和偷竊成功的機率。
LibraAll.label = 對所有怪物使用窺伺探測
LibraAll.help = 顯示所有怪物的探測資料，如同已用窺伺探測探測過，不會變更存檔。你手動關閉的怪物（在怪物圖鑑中對其按下決定）仍維持關閉。
Libra by hand.label = 手動窺伺探測
Libra by hand.help = 在怪物圖鑑中對怪物按下決定，即可切換其窺伺探測（探測資料）的開／關，不論遊戲本身的紀錄為何。此操作會清除所有手動設定。
Libra by hand.button = 全部清除
Libra by hand.done = 已清除窺伺探測的手動設定

