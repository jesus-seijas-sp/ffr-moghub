; MogHub Bestiary - French texts, translated from en.ini. Corrections welcome.

; --- name and settings ---
plugin.name = MogHub Bestiary
plugin.description = Un bestiaire dans le menu principal : chaque ennemi rencontré, classé par zone, avec les données d'analyse du jeu (Acuité) une fois analysé, son sprite de combat animé et les lieux où le trouver.
screen.title = Bestiaire
ShowAll.label = Afficher tous les monstres
ShowAll.help = Affiche chaque monstre dans toutes les zones où il apparaît, y compris ceux que vous n'avez pas encore rencontrés (grisés, données d'analyse masquées jusqu'à ce que vous les analysiez ou activiez Acuité pour eux). Les compteurs Rencontrés et Analysés restent fidèles à vos rencontres réelles.
AreaLevels.label = Niveaux des ennemis par zone
AreaLevels.help = La fourchette de niveaux des combats aléatoires d'une zone (hors boss), dans son panneau du Bestiaire. Les villes et les grottes dont les ennemis attendent sur la carte n'en ont pas.
header.Libra = Acuité
LibraPlus.label = Acuité+
LibraPlus.help = Les chiffres exacts que l'analyse du jeu ne montre pas : la résistance du monstre à chaque altération d'état, et les chances de chaque butin et de réussite d'un vol.
LibraAll.label = Acuité sur tous les monstres
LibraAll.help = Les données d'analyse de chaque monstre s'affichent comme si vous l'aviez analysé avec Acuité, sans modifier votre sauvegarde. Un monstre désactivé manuellement (Confirmer sur lui dans le Bestiaire) reste désactivé.
Libra by hand.label = Acuité manuelle
Libra by hand.help = Dans le Bestiaire, Confirmer sur un monstre active ou désactive son Acuité (données d'analyse), quoi qu'en dise le jeu. Cette option efface tous ces choix.
Libra by hand.button = Tout effacer
Libra by hand.done = Choix d'Acuité effacés

; --- messages ---
encountered = Rencontrés
