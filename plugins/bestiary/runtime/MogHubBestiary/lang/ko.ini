; MogHub Bestiary - Korean texts, translated from en.ini. Corrections welcome.

; --- name and settings ---
plugin.name = MogHub Bestiary
plugin.description = 메인 메뉴에 몬스터 도감을 추가한다. 만난 적을 지역별로 표시하며, 라이브라로 조사한 적은 게임의 조사 정보, 움직이는 배틀 스프라이트, 출현 장소를 확인할 수 있다.
screen.title = 몬스터 도감
ShowAll.label = 모든 몬스터 표시
ShowAll.help = 아직 만나지 않은 몬스터도 포함해 모든 몬스터를 출현하는 모든 지역에 표시한다(어둡게 표시되며, 라이브라로 조사하거나 라이브라를 ON으로 할 때까지 조사 정보는 숨겨진다). 조우 수와 조사 수는 실제로 만난 수 그대로 유지된다.
AreaLevels.label = 지역별 적 레벨
AreaLevels.help = 지역의 인카운트에서 나오는 적의 레벨 범위(보스 제외)를 도감의 지역 정보에 표시한다. 마을이나 적이 맵 위에서 기다리는 동굴에는 표시되지 않는다.
header.Libra = 라이브라
LibraPlus.label = 라이브라+
LibraPlus.help = 게임의 라이브라에 표시되지 않는 정확한 수치를 표시한다. 각 상태이상에 대한 내성과 각 드롭 및 훔치기 성공 확률.
LibraAll.label = 모든 몬스터에 라이브라
LibraAll.help = 세이브 데이터를 변경하지 않고, 라이브라로 조사한 것처럼 모든 몬스터의 조사 정보를 표시한다. 직접 OFF로 한 몬스터(도감에서 결정)는 OFF 상태가 유지된다.
Libra by hand.label = 라이브라 직접 설정
Libra by hand.help = 몬스터 도감에서 몬스터를 선택해 결정하면, 게임의 상태와 관계없이 그 몬스터의 라이브라(조사 정보)를 ON/OFF로 전환한다. 이렇게 직접 설정한 내용을 모두 초기화한다.
Libra by hand.button = 모두 초기화
Libra by hand.done = 라이브라 직접 설정을 초기화했다

; --- messages ---
encountered = 조우
forms = 형태 {1} / {2}  (←/→)
libraOff = 라이브라: OFF
libraOn = 라이브라: ON
locations = 출현 장소
notMet = 아직 만나지 않음
scanned = 조사 완료
setByYou = (직접 설정)
enemyLevel = 적의 레벨
statusResist = 상태이상 내성
