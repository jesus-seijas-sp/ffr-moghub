; MogHub Bestiary - Simplified Chinese texts, translated from en.ini. Corrections welcome.

; --- name and settings ---
plugin.name = MogHub Bestiary
plugin.description = 主菜单中的怪物图鉴：按区域列出你遇到过的所有敌人，分析后显示游戏自带的分析信息，以及其战斗动画形象和出没地点。
screen.title = 怪物图鉴
ShowAll.label = 显示全部怪物
ShowAll.help = 在怪物出现的所有区域下列出全部怪物，包括尚未遇到的怪物（显示为暗色，在分析或为其开启分析前隐藏分析数据）。“已遇到”和“已分析”的计数仍为你的实际记录。
AreaLevels.label = 区域敌人等级
AreaLevels.help = 在怪物图鉴的区域信息中显示该区域遇敌时敌人的等级范围（不含首领）。城镇以及敌人在地图上等待的洞窟没有此项。
header.Libra = 分析
LibraPlus.label = 分析+
LibraPlus.help = 显示游戏分析中未显示的精确数值：怪物对各种状态异常的抗性，以及各项掉落和偷窃成功的几率。
LibraAll.label = 分析全部怪物
LibraAll.help = 显示所有怪物的分析数据，如同已对其使用分析，且不会改变存档。在怪物图鉴中手动关闭的怪物（对其按确定）仍保持关闭。
Libra by hand.label = 手动分析设置
Libra by hand.help = 在怪物图鉴中对怪物按确定，可无视游戏记录切换其分析（分析数据）的开/关。此操作将清除所有此类设置。
Libra by hand.button = 全部清除
Libra by hand.done = 已清除手动分析设置

; --- messages ---
encountered = 已遇到
forms = 形态 {1}/{2}（左/右）
libraOff = 分析：关
libraOn = 分析：开
locations = 出没地点
notMet = 尚未遇到
scanned = 已分析
