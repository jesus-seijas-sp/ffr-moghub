; MogHub Bestiary - Japanese texts, translated from en.ini. Corrections welcome.

; --- name and settings ---
plugin.name = MogHub Bestiary
plugin.description = メインメニューにモンスター図鑑を追加します。遭遇したすべての敵をエリアごとに一覧表示し、ライブラ済みの敵はゲーム本来のライブラ情報、バトル中のアニメーション、出現場所を確認できます。
screen.title = モンスター図鑑
ShowAll.label = 全モンスターを表示
ShowAll.help = まだ遭遇していないものも含め、すべてのモンスターを出現する全エリアに表示する（未遭遇のものは暗く表示され、ライブラするか、そのモンスターのライブラをオンにするまで情報は隠される）。遭遇数とライブラ数は実際の記録のまま。
AreaLevels.label = エリアの敵のレベル
AreaLevels.help = エリアのエンカウントで出る敵のレベル範囲（ボスを除く）をモンスター図鑑のエリア欄に表示する。街や、敵がマップ上で待ち構える洞窟には表示されない。
header.Libra = ライブラ
LibraPlus.label = ライブラ+
LibraPlus.help = ゲームのライブラでは表示されない正確な数値を表示する。各状態異常への耐性と、各ドロップおよびぬすむの成功確率。
LibraAll.label = 全モンスターにライブラ
LibraAll.help = セーブデータを変更せずに、ライブラを使ったときと同じように全モンスターの情報を表示する。モンスター図鑑で手動でオフにしたモンスター（決定で切り替え）はオフのまま。
Libra by hand.label = 手動ライブラ設定
Libra by hand.help = モンスター図鑑でモンスターを決定すると、ゲームの記録に関係なくライブラ（情報表示）のオン/オフを切り替えられる。この操作で、手動で設定した内容をすべて消去する。
Libra by hand.button = すべて消去
Libra by hand.done = 手動ライブラ設定を消去しました

; --- messages ---
encountered = 遭遇
forms = 形態 {1} / {2}  （←/→）
libraOff = ライブラ：オフ
libraOn = ライブラ：オン
locations = 出現場所
notMet = 未遭遇
scanned = ライブラ済み
setByYou = （手動設定）
enemyLevel = 敵のレベル
statusResist = 状態異常耐性
