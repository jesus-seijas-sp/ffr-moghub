; MogHub Trainer - Korean texts, translated from en.ini. Corrections welcome.

; --- name and settings ---
plugin.name = MogHub Trainer
plugin.description = 치트와 부스터: 무적 모드, 터보, 자동 배틀, 보상, 드롭과 훔치기, 인카운트 등. 각 기능(또는 트레이너)을 OFF로 하면 원래대로 돌아간다. "내 게임"은 진행 상황을 직접 변경한다: 길, 레벨, 아이템, 아티팩트, 비전, 라이브라, SHOP, 맵.
header.Battle = 배틀
GodMode.label = 무적 모드
GodMode.help = 파티의 HP와 MP가 가득 찬 상태로 유지되며, 받는 데미지가 0이 된다. 단축키: Ctrl+F1.
InfiniteHP.label = HP 무한
InfiniteHP.help = 배틀 중 파티의 HP가 회복된다.
InfiniteMP.label = MP 무한
InfiniteMP.help = 배틀 중 파티의 MP가 회복된다.
FullLimitBreak.label = 리미트 버스트 최대
FullLimitBreak.help = 리미트 버스트 게이지가 가득 찬 상태로 유지된다.
LBGainMultiplier.label = 리미트 버스트 증가량
LBGainMultiplier.help = 리미트 버스트 게이지가 차는 속도.
KeepLimitBurst.label = 리미트 버스트 유지
KeepLimitBurst.help = 각 캐릭터의 리미트 버스트 게이지가 다음 배틀로 이어진다.
MPCostPercent.label = MP 소비
MPCostPercent.help = 스킬의 MP 소비량(일반 대비 비율). 올림 처리되므로 0%일 때만 무료가 된다.
OneHitKill.label = 일격필살
OneHitKill.help = 적을 한 번의 공격으로 쓰러뜨린다. 단축키: Ctrl+F5.
Preset.label = 난이도 프리셋
Preset.help = 게임 자체 난이도에 더해 아래 5개 값을 한 번에 설정한다. 하드는 Normal과 Expert 사이, 나이트메어는 Expert를 크게 넘어선다. 5개 중 하나를 바꾸면 커스텀이 된다.
Preset.choice.custom = 커스텀
Preset.choice.normal = 노멀
Preset.choice.hard = 하드
Preset.choice.veryhard = 베리 하드
Preset.choice.nightmare = 나이트메어
DamageDealtMultiplier.label = 주는 데미지
DamageTakenMultiplier.label = 받는 데미지
EnemyHPMultiplier.label = 적 HP
EnemySpeedMultiplier.label = 적 속도
EnemyBreakMultiplier.label = 적 브레이크 게이지
EnemyBreakMultiplier.help = 적이 가진 브레이크 게이지의 양.
AlwaysEscape.label = 항상 도주 성공
AlwaysEscape.help = 도주가 항상 성공한다. 도주할 수 없는 배틀은 제외.
HealAfterBattle.label = 배틀 후 회복
HealAfterBattle.help = 배틀이 끝나면 파티의 HP와 MP가 회복된다.
AutoBattle.label = 자동 배틀
AutoBattle.help = 캐릭터가 스스로 행동한다("자동 배틀 모드" 참고). 먼저 직접 한 번 공격해야 한다. 단축키: Ctrl+F2.
AutoBattleMode.label = 자동 배틀 모드
AutoBattleMode.help = 공격: 모든 캐릭터가 기본 공격을 한다. 마지막 커맨드 반복: 각 캐릭터가 마지막으로 선택한 커맨드(스킬과 마법, 아이템 제외)를 반복한다. 회복과 강화는 HP가 가장 낮은 아군에게 사용하며, 대상이 쓰러지면 다른 대상으로 바뀐다. 사용할 수 없는 커맨드(MP 부족)는 공격이 된다.
AutoBattleMode.choice.attack = 공격
AutoBattleMode.choice.repeat = 마지막 커맨드 반복
AutoConfirmResults.label = 결과 자동 결정
AutoConfirmResults.help = 자동 배틀이 ON이면 결과 화면이 자동으로 결정된다.
header.Speed = 속도
TurboMultiplier.label = 터보
TurboMultiplier.help = 필드, 배틀, 컷신 등 게임 전체의 속도를 올린다. 단축키: Ctrl+F6.
BattleSpeedMultiplier.label = 배틀 속도
BattleSpeedMultiplier.help = 게임 자체의 배틀 속도 단계에 배율을 적용한다.
FieldSpeedMultiplier.label = 이동 속도
FieldSpeedMultiplier.help = 단축키: Ctrl+F4.
header.Rewards = 보상
ExpMultiplier.label = EXP
GilMultiplier.label = 길
MRPMultiplier.label = MRP
APMultiplier.label = AP
DropRateMultiplier.label = 드롭률
AlwaysDropRare.label = 항상 레어 아이템 드롭
AlwaysSteal.label = 훔치기 항상 성공
AlwaysStealRare.label = 훔치기로 레어 아이템 획득
RareEnemyMultiplier.label = 레어 적 출현율
RareEnemyMultiplier.help = 사보텐더, 길거북, 포트가 인카운트에서 나타나는 빈도.
GilAmount.label = 추가할 길
GilAmount.choice.1000 = 1,000
GilAmount.choice.10000 = 10,000
GilAmount.choice.100000 = 100,000
GilAmount.choice.1000000 = 1,000,000
Add Gil.label = 길 추가
Add Gil.help = 위에서 설정한 금액을 소지 길에 추가한다.
Add Gil.button = 추가
header.Abilities = 어빌리티
APCostPercent.label = 어빌리티 AP 비용
APCostPercent.help = 어빌리티, 패시브, 마스터 스킬을 장착하는 데 드는 AP(일반 대비 비율). 0%면 모두 무료로 장착할 수 있다.
header.Shops = SHOP
BuyPricePercent.label = 구매 가격
BuyPricePercent.help = SHOP의 판매 가격(일반 대비 비율).
SellPricePercent.label = 판매 가격
SellPricePercent.help = SHOP에서 아이템을 팔 때 받는 가격(일반 대비 비율).
UnlimitedStock.label = 무제한 재고
UnlimitedStock.help = SHOP의 수량 한정 아이템을 제한 없이 구매할 수 있다.
ShopAllItems.label = 아이템 SHOP 전품목 판매
ShopAllItems.help = 모든 아이템 SHOP에서 가격이 정해진 모든 소모품도 판매한다. OFF로 하면 추가된 아이템은 게임을 다시 시작할 때까지 품절로 표시된다.
header.Field = 필드
Encounters.label = 인카운트
Encounters.help = 단축키: Ctrl+F3.
EncounterRate.label = 인카운트율
header.Your game = 내 게임
Heal party.label = 파티 회복
Heal party.help = 전투불능 캐릭터를 포함한 모든 캐릭터의 HP와 MP를 어디서든 완전히 회복한다.
Heal party.button = 회복
Max Gil.label = 길 최대
Max Gil.help = 소지 길을 게임의 상한(99,999,999)으로 설정한다. 이 항목의 다른 기능과 마찬가지로 게임이 즉시 변경되며, 세이브하면 유지된다. 되돌리려면 세이브하지 말고 세이브 데이터를 불러온다.
Max Gil.button = 최대
LevelTarget.label = 목표 레벨
LevelTarget.help = "모든 캐릭터 레벨 업"에 사용.
Raise every character.label = 모든 캐릭터 레벨 업
Raise every character.help = 위의 레벨보다 낮은 모든 캐릭터가 게임 자체의 EXP 설정 기능을 통해 그 레벨까지의 EXP를 얻는다. 이미 더 높은 캐릭터는 그대로 유지된다.
Raise every character.button = 레벨 업
ItemCount.label = 소모품 개수
ItemCount.help = "모든 소모품 보충"에 사용.
Stock every consumable.label = 모든 소모품 보충
Stock every consumable.help = 아직 가지고 있지 않은 것을 포함해 모든 소모품(포션, 에테르 등)을 위의 개수로 설정한다.
Stock every consumable.button = 보충
Get every artifact.label = 모든 아티팩트 획득
Get every artifact.help = 아직 가지고 있지 않은 완성된 아티팩트를 모두 추가한다(게임 파일 내의 미완성 아티팩트는 제외).
Get every artifact.button = 획득
Max Mastery Rank.label = MASTERY RANK 최대
Max Mastery Rank.help = 소지한 모든 비전에 대해 모든 캐릭터의 MASTERY RANK를 최대로 한다. 각 랭크의 보상(AP, 능력치, 마스터 스킬)도 전투에서 얻은 것처럼 받는다.
Max Mastery Rank.button = 최대
Max awakening.label = 각성도 최대
Max awakening.help = 소지한 모든 비전을 완전히 각성시킨다.
Max awakening.button = 최대
Libra on every enemy met.label = 만난 모든 적에 라이브라
Libra on every enemy met.help = 만난 적이 있는 모든 적을 배틀에서 조사한 것처럼 라이브라로 조사한 상태로 만든다. 약점도 포함된다.
Libra on every enemy met.button = 조사
Restock shops.label = SHOP 재입고
Restock shops.help = 모든 SHOP의 수량 한정 아이템이 다시 입고된다.
Restock shops.button = 재입고
Reveal every map.label = 모든 맵 공개
Reveal every map.help = 맵 화면에 모든 지역이 표시된다(이벤트 전용 스테이지는 제외).
Reveal every map.button = 공개
header.General = 일반
Notices.label = 화면 메시지
Notices.help = 단축키로 무언가를 변경했을 때 짧은 메시지를 표시한다.
Reset everything.label = 모두 초기화
Reset everything.help = 모든 옵션을 게임의 원래 값으로 되돌린다.
Reset everything.button = 초기화
header.Keys = 단축키

; --- messages ---
artifactsDone = 아티팩트 {1}개 추가
autoChoose = 자동 배틀: 이 행동은 직접 선택할 것
autoLearn = 자동 배틀: 직접 한 번 공격하면 이후 자동으로 진행
awakeningDone = 비전 {1}개 완전 각성
gilAdded = {1}길 추가
healDone = 캐릭터 {1}명 회복
libraDone = 적 {1}종을 라이브라로 조사
mapsDone = 맵 {1}개 공개
masteryDone = 비전/캐릭터 {1}쌍 MASTERY RANK 최대 (랭크 보상 {2}개)
maxGilDone = 길: {1}
partyHealed = 파티 회복
qolEncounters = 인카운트는 FFRS-QoL이 처리 중
qolNote = (FFRS-QoL이 설치되어 있어 그쪽에서 처리한다. 이 설정은 효과가 없다.)
raiseDone = 캐릭터 {1}명을 Lv. {2}(으)로 레벨 업
resetDone = MogHub Trainer: 모두 원래대로 되돌렸다
restockDone = SHOP 아이템 {1}종 재입고
stockDone = 소모품 {1}종을 {2}개로 설정
turbo = 터보: x{1}
walkSpeed = 이동 속도: x{1}
saveToKeep = 유지하려면 게임을 저장하세요.
InfiniteGil.label = 길 무한
InfiniteGil.help = 켜져 있는 동안 길이 최대치(99,999,999)로 유지된다. 어떤 저장 데이터를 불러와도, 무엇을 사도, 저장할 필요가 없다. 끄면 길은 그 상태 그대로 남는다.
