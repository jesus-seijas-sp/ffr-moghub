; MogHub Trainer - Simplified Chinese texts, translated from en.ini. Corrections welcome.

; --- name and settings ---
plugin.name = MogHub Trainer
plugin.description = 作弊与增益功能：无敌模式、加速、自动战斗、报酬、掉落与偷窃、遇敌等，关闭这些选项（或修改器）后即恢复原状。“游戏进度”栏目会直接修改你的进度：金币、等级、道具、古遗物、幻兵、分析、商店与地图。
header.Battle = 战斗
GodMode.label = 无敌模式
GodMode.help = 队伍的生命值和法力值保持全满，所受伤害为0。快捷键：Ctrl+F1。
InfiniteHP.label = 无限生命值
InfiniteHP.help = 战斗中持续恢复队伍的生命值。
InfiniteMP.label = 无限法力值
InfiniteMP.help = 战斗中持续恢复队伍的法力值。
FullLimitBreak.label = 极限技全满
FullLimitBreak.help = 极限技量表始终保持全满。
LBGainMultiplier.label = 极限技增长
LBGainMultiplier.help = 极限技量表的积累速度。
KeepLimitBurst.label = 保留极限技
KeepLimitBurst.help = 每个角色的极限技量表会延续到下一场战斗。
MPCostPercent.label = 法力值消耗
MPCostPercent.help = 技能的法力值消耗，按正常值的百分比计算（向上取整，因此只有0%才会免费）。
OneHitKill.label = 一击必杀
OneHitKill.help = 敌人一击即倒。快捷键：Ctrl+F5。
Preset.label = 难度预设
Preset.help = 在游戏自身难易度的基础上，一次性设定下方五项数值：困难介于普通与专家之间，噩梦远超专家。更改五项中的任意一项即变为自定义。
Preset.choice.custom = 自定义
Preset.choice.normal = 普通
Preset.choice.hard = 困难
Preset.choice.veryhard = 非常困难
Preset.choice.nightmare = 噩梦
DamageDealtMultiplier.label = 造成伤害
DamageTakenMultiplier.label = 所受伤害
EnemyHPMultiplier.label = 敌人生命值
EnemySpeedMultiplier.label = 敌人速度
EnemyBreakMultiplier.label = 敌人破防量表
EnemyBreakMultiplier.help = 调整敌人破防量表的大小。
AlwaysEscape.label = 必定逃走
AlwaysEscape.help = 逃走必定成功（无法逃走的战斗除外）。
HealAfterBattle.label = 战斗后恢复
HealAfterBattle.help = 战斗结束时恢复队伍的生命值和法力值。
AutoBattle.label = 自动战斗
AutoBattle.help = 角色会自行行动（见“自动战斗模式”）。请先手动攻击一次。快捷键：Ctrl+F2。
AutoBattleMode.label = 自动战斗模式
AutoBattleMode.help = 攻击：所有角色使用普通攻击。重复上次指令：每个角色重复你为其选择的上一个指令（技能和魔法，不含道具）；治疗和增益会用于生命值最低的队友，目标倒下时会自动更换。无法使用的指令（法力值不足）会改为攻击。
AutoBattleMode.choice.attack = 攻击
AutoBattleMode.choice.repeat = 重复上次指令
AutoConfirmResults.label = 自动确认结算
AutoConfirmResults.help = 开启自动战斗时，自动确认结算画面。
header.Speed = 速度
TurboMultiplier.label = 加速
TurboMultiplier.help = 加快整个游戏的速度：野外、战斗与过场动画。快捷键：Ctrl+F6。
BattleSpeedMultiplier.label = 战斗速度
BattleSpeedMultiplier.help = 按倍率调整游戏自带的各档战斗速度。
FieldSpeedMultiplier.label = 行走速度
FieldSpeedMultiplier.help = 快捷键：Ctrl+F4。
header.Rewards = 报酬
ExpMultiplier.label = 经验值
GilMultiplier.label = 金币
MRPMultiplier.label = MRP
APMultiplier.label = AP
DropRateMultiplier.label = 掉落率
AlwaysDropRare.label = 必定掉落稀有道具
AlwaysSteal.label = 偷窃必定成功
AlwaysStealRare.label = 偷窃必得稀有道具
RareEnemyMultiplier.label = 稀有敌人出现率
RareEnemyMultiplier.help = 仙人掌怪、金币龟和瓮在遇敌战斗中出现的频率。
GilAmount.label = 增加的金币数
GilAmount.choice.1000 = 1,000
GilAmount.choice.10000 = 10,000
GilAmount.choice.100000 = 100,000
GilAmount.choice.1000000 = 1,000,000
Add Gil.label = 增加金币
Add Gil.help = 将上方设定的数额加到你的金币中。
Add Gil.button = 增加
header.Abilities = 能力
APCostPercent.label = 能力AP消耗
APCostPercent.help = 装备能力、被动技能和大师技能所需的AP，按正常值的百分比计算。设为0%时全部可免费装备。
header.Shops = 商店
BuyPricePercent.label = 购买价格
BuyPricePercent.help = 商店的售价，按正常价格的百分比计算。
SellPricePercent.label = 出售价格
SellPricePercent.help = 商店收购你的道具的价格，按正常价格的百分比计算。
UnlimitedStock.label = 无限库存
UnlimitedStock.help = 商店限量出售的商品可以无限购买。
ShopAllItems.label = 道具商店出售全部商品
ShopAllItems.help = 每家道具商店还会出售游戏中所有设有价格的消耗品。关闭后，新增的商品会显示为售罄，直到重新启动游戏。
header.Field = 野外
Encounters.label = 遇敌
Encounters.help = 快捷键：Ctrl+F3。
EncounterRate.label = 遇敌率
header.Your game = 游戏进度
Heal party.label = 恢复队伍
Heal party.help = 随时随地将所有角色的生命值和法力值恢复全满，包括无法战斗的角色。
Heal party.button = 恢复
Max Gil.label = 金币最大化
Max Gil.help = 将金币设为游戏允许的最大值（99,999,999）。与本栏目的所有功能一样，会立即改变你的游戏，并在存档时保留；如需撤销，请不存档直接读取存档。
Max Gil.button = 最大化
LevelTarget.label = 目标等级
LevelTarget.help = 用于“提升全体角色”。
Raise every character.label = 提升全体角色
Raise every character.help = 所有低于上方等级的角色，将通过游戏自身设置经验值的功能获得所需经验值。等级已高于该等级的角色保持不变。
Raise every character.button = 提升
ItemCount.label = 消耗品数量
ItemCount.help = 用于“设置全部消耗品”。
Stock every consumable.label = 设置全部消耗品
Stock every consumable.help = 将每种消耗品（药水、以太等）的数量设为上方数值，包括尚未拥有的消耗品。
Stock every consumable.button = 设置
Get every artifact.label = 获得全部古遗物
Get every artifact.help = 添加所有尚未拥有的已完成古遗物（游戏文件中未完成的古遗物除外）。
Get every artifact.button = 获得
Max Mastery Rank.label = MASTERY RANK最大化
Max Mastery Rank.help = 每个角色在你拥有的每个幻兵上的MASTERY RANK均提升至最大。
Max Mastery Rank.button = 最大化
Max awakening.label = 觉醒度最大化
Max awakening.help = 你拥有的所有幻兵完全觉醒。
Max awakening.button = 最大化
Libra on every enemy met.label = 分析所有遇到过的敌人
Libra on every enemy met.help = 所有遇到过的敌人均视为已分析（包括弱点），如同在战斗中分析过一样。
Libra on every enemy met.button = 分析
Restock shops.label = 商店补货
Restock shops.help = 所有商店的限量商品重新补货。
Restock shops.button = 补货
Reveal every map.label = 显示全部地图
Reveal every map.help = 地图画面上显示所有区域（仅用于剧情事件的关卡除外）。
Reveal every map.button = 显示
header.General = 通用
Notices.label = 屏幕提示
Notices.help = 通过快捷键更改设置时显示简短提示。
Reset everything.label = 全部重置
Reset everything.help = 将所有选项恢复为游戏的正常数值。
Reset everything.button = 重置
header.Keys = 按键

