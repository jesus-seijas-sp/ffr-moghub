; MogHub Trainer - Japanese texts, translated from en.ini. Corrections welcome.

; --- name and settings ---
plugin.name = MogHub Trainer
plugin.description = チートと強化：無敵、ターボ、オートバトル、報酬、ドロップとぬすむ、エンカウントなど。オフにする（またはトレーナーをオフにする）と元に戻ります。「ゲームデータ」の項目は進行状況を直接変更します：ギル、レベル、アイテム、アーティファクト、ビジョン、ライブラ、SHOP、マップ。
header.Battle = バトル
GodMode.label = 無敵モード
GodMode.help = パーティのHPとMPが常に満タンになり、受けるダメージが0になる。ホットキー：Ctrl+F1
InfiniteHP.label = HP無限
InfiniteHP.help = バトル中、パーティのHPが回復し続ける。
InfiniteMP.label = MP無限
InfiniteMP.help = バトル中、パーティのMPが回復し続ける。
FullLimitBreak.label = リミットバースト常時MAX
FullLimitBreak.help = リミットバーストゲージが常に満タンになる。
LBGainMultiplier.label = リミットバーストの上昇量
LBGainMultiplier.help = リミットバーストゲージがたまる速さ。
KeepLimitBurst.label = リミットバーストを持ち越す
KeepLimitBurst.help = 各キャラクターのリミットバーストゲージを次のバトルに持ち越す。
MPCostPercent.label = MP消費
MPCostPercent.help = スキルの消費MP（通常に対する割合）。切り上げのため、無料になるのは0%のときだけ。
OneHitKill.label = 一撃必殺
OneHitKill.help = 敵を一撃で倒せる。ホットキー：Ctrl+F5
Preset.label = 難易度プリセット
Preset.help = ゲーム本来の難易度に加えて、下の5つの値を一度に設定する。ハードはNormalとExpertの間、ナイトメアはExpertをはるかに超える。5つのどれかを変えるとカスタムになる。
Preset.choice.custom = カスタム
Preset.choice.normal = ノーマル
Preset.choice.hard = ハード
Preset.choice.veryhard = ベリーハード
Preset.choice.nightmare = ナイトメア
DamageDealtMultiplier.label = 与ダメージ
DamageTakenMultiplier.label = 被ダメージ
EnemyHPMultiplier.label = 敵のHP
EnemySpeedMultiplier.label = 敵のスピード
EnemyBreakMultiplier.label = 敵のブレイクゲージ
EnemyBreakMultiplier.help = 敵のブレイクゲージの量。
AlwaysEscape.label = 必ず逃げられる
AlwaysEscape.help = 逃げられないバトルを除き、必ず逃げることができる。
HealAfterBattle.label = バトル後に回復
HealAfterBattle.help = バトル終了時にパーティのHPとMPが全回復する。
AutoBattle.label = オートバトル
AutoBattle.help = キャラクターが自動で通常攻撃を行う。最初に一度だけ手動で攻撃すること。ホットキー：Ctrl+F2
AutoConfirmResults.label = リザルト自動決定
AutoConfirmResults.help = オートバトル中、リザルト画面を自動で決定する。
header.Speed = スピード
TurboMultiplier.label = ターボ
TurboMultiplier.help = フィールド、バトル、イベントシーンなど、ゲーム全体を高速化する。ホットキー：Ctrl+F6
BattleSpeedMultiplier.label = バトルスピード
BattleSpeedMultiplier.help = ゲーム本来のバトルスピードの各段階に倍率をかける。
FieldSpeedMultiplier.label = 移動速度
FieldSpeedMultiplier.help = ホットキー：Ctrl+F4
header.Rewards = 報酬
ExpMultiplier.label = EXP
GilMultiplier.label = ギル
MRPMultiplier.label = MRP
APMultiplier.label = AP
DropRateMultiplier.label = ドロップ率
AlwaysDropRare.label = 必ずレアアイテムをドロップ
AlwaysSteal.label = ぬすむが必ず成功
AlwaysStealRare.label = ぬすむで必ずレアアイテム
RareEnemyMultiplier.label = レアな敵の出現率
RareEnemyMultiplier.help = サボテンダー、ギルガメ、ポットがエンカウントで出現する頻度。
GilAmount.label = 追加するギル
GilAmount.choice.1000 = 1,000
GilAmount.choice.10000 = 10,000
GilAmount.choice.100000 = 100,000
GilAmount.choice.1000000 = 1,000,000
Add Gil.label = ギルを追加
Add Gil.help = 上で選んだ額のギルを追加する。
Add Gil.button = 追加
header.Abilities = アビリティ
APCostPercent.label = アビリティのAPコスト
APCostPercent.help = アビリティ、パッシブ、マスタースキルの装備に必要なAP（通常に対する割合）。0%ですべて無料で装備できる。
header.Shops = SHOP
BuyPricePercent.label = 購入価格
BuyPricePercent.help = SHOPでの値段（通常に対する割合）。
SellPricePercent.label = 売却価格
SellPricePercent.help = SHOPでアイテムを売ったときの値段（通常に対する割合）。
UnlimitedStock.label = 在庫無制限
UnlimitedStock.help = SHOPの数量限定アイテムを制限なく買える。
header.Field = フィールド
Encounters.label = エンカウント
Encounters.help = ホットキー：Ctrl+F3
EncounterRate.label = エンカウント率
header.Your game = ゲームデータ
Heal party.label = パーティを回復
Heal party.help = 戦闘不能のキャラクターも含め、全キャラクターのHPとMPをどこでも全回復する。
Heal party.button = 回復
Max Gil.label = ギル最大
Max Gil.help = 所持ギルをゲームの上限（99,999,999）にする。この項目の操作はすべて即座にゲームに反映され、セーブすると保存される。元に戻すには、セーブせずにセーブデータをロードすること。
Max Gil.button = 最大
LevelTarget.label = 目標レベル
LevelTarget.help = 「全キャラクターのレベルアップ」用。
Raise every character.label = 全キャラクターのレベルアップ
Raise every character.help = 上のレベル未満のキャラクター全員に、そのレベルまでのEXPをゲーム本来のEXP設定処理で与える。すでにそれ以上のキャラクターはそのまま。
Raise every character.button = レベルアップ
ItemCount.label = 消耗品の個数
ItemCount.help = 「全消耗品を補充」用。
Stock every consumable.label = 全消耗品を補充
Stock every consumable.help = すべての消耗品（ポーション、エーテルなど）を上の個数にする。まだ持っていないものも含む。
Stock every consumable.button = 補充
Get every artifact.label = 全アーティファクトを入手
Get every artifact.help = 未所持の完成済みアーティファクトをすべて追加する（ゲームデータ内の未完成のものは除く）。
Get every artifact.button = 入手
Max Mastery Rank.label = MASTERY RANK最大
Max Mastery Rank.help = 所持しているすべてのビジョンについて、全キャラクターのMASTERY RANKを最大にする。
Max Mastery Rank.button = 最大
Max awakening.label = 覚醒度最大
Max awakening.help = 所持しているすべてのビジョンの覚醒度を最大にする。
Max awakening.button = 最大
Libra on every enemy met.label = 遭遇した全敵にライブラ
Libra on every enemy met.help = 遭遇したことのあるすべての敵を、弱点も含めてライブラ済みにする。バトルでライブラを使った場合と同じ扱いになる。
Libra on every enemy met.button = ライブラ
Restock shops.label = SHOPの在庫を補充
Restock shops.help = すべてのSHOPの数量限定アイテムが再入荷する。
Restock shops.button = 補充
Reveal every map.label = 全マップを開放
Reveal every map.help = マップ画面にすべてのエリアが表示される（イベント専用ステージは除く）。
Reveal every map.button = 開放
header.General = 全般
Notices.label = 画面メッセージ
Notices.help = ホットキーで設定が変わったときに短いメッセージを表示する。
Reset everything.label = すべてリセット
Reset everything.help = すべての設定をゲーム本来の値に戻す。
Reset everything.button = リセット
header.Keys = キー

