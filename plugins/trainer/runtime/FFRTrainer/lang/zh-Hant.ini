; FFR Trainer - Traditional Chinese texts, translated from en.ini. Corrections welcome.

; --- name and settings ---
plugin.name = FFR Trainer
plugin.description = 作弊與強化：無敵模式、加速、自動戰鬥、報酬、掉落與偷竊、遇敵等，關閉該項目（或修改器本身）後即恢復原狀。「你的遊戲」會直接修改你的進度：GIL、等級、道具、古遺物、幻兵、窺伺探測、商店與地圖。
header.Battle = 戰鬥
GodMode.label = 無敵模式
GodMode.help = 隊伍的HP與MP維持全滿，受到的傷害為0。快捷鍵：Ctrl+F1。
InfiniteHP.label = 無限HP
InfiniteHP.help = 戰鬥中持續回復隊伍的HP。
InfiniteMP.label = 無限MP
InfiniteMP.help = 戰鬥中持續回復隊伍的MP。
FullLimitBreak.label = 極限技全滿
FullLimitBreak.help = 極限技量表維持全滿。
NoMPCost.label = 不消耗MP
NoMPCost.help = 使用技能不消耗MP。
OneHitKill.label = 一擊必殺
OneHitKill.help = 敵人一擊即倒。快捷鍵：Ctrl+F5。
DamageDealtMultiplier.label = 造成的傷害
DamageTakenMultiplier.label = 受到的傷害
EnemyHPMultiplier.label = 敵人HP
EnemySpeedMultiplier.label = 敵人速度
EnemyBreakMultiplier.label = 敵人擊潰量表
EnemyBreakMultiplier.help = 敵人擊潰量表的多寡。
AlwaysEscape.label = 必定逃跑成功
AlwaysEscape.help = 逃跑必定成功，無法逃跑的戰鬥除外。
HealAfterBattle.label = 戰鬥後回復
HealAfterBattle.help = 戰鬥結束時回復隊伍的HP與MP。
AutoBattle.label = 自動戰鬥
AutoBattle.help = 角色會自行使用普通攻擊。請先手動攻擊一次。快捷鍵：Ctrl+F2。
AutoConfirmResults.label = 自動確認結算
AutoConfirmResults.help = 自動戰鬥開啟時，會自動確認結算畫面。
header.Speed = 速度
TurboMultiplier.label = 加速
TurboMultiplier.help = 加快整個遊戲的速度：野外、戰鬥與過場動畫。快捷鍵：Ctrl+F6。
BattleSpeedMultiplier.label = 戰鬥速度
BattleSpeedMultiplier.help = 按倍率調整遊戲本身的各段戰鬥速度。
FieldSpeedMultiplier.label = 移動速度
FieldSpeedMultiplier.help = 快捷鍵：Ctrl+F4。
header.Rewards = 報酬
ExpMultiplier.label = EXP
GilMultiplier.label = GIL
MRPMultiplier.label = MRP
APMultiplier.label = AP
DropRateMultiplier.label = 掉落率
AlwaysDropRare.label = 必定掉落稀有道具
AlwaysSteal.label = 偷竊必定成功
AlwaysStealRare.label = 偷竊必得稀有道具
GilAmount.label = 增加的GIL
GilAmount.choice.1000 = 1,000
GilAmount.choice.10000 = 10,000
GilAmount.choice.100000 = 100,000
GilAmount.choice.1000000 = 1,000,000
Add Gil.label = 增加GIL
Add Gil.help = 將上方設定的金額加到你的GIL。
Add Gil.button = 增加
header.Field = 野外
Encounters.label = 遇敵
Encounters.help = 快捷鍵：Ctrl+F3。
EncounterRate.label = 遇敵率
header.Your game = 你的遊戲
Max Gil.label = GIL最大化
Max Gil.help = 將GIL設為遊戲允許的上限（99,999,999）。與本區所有項目相同，會立即修改你的遊戲，並在存檔時保留；若要復原，請不存檔直接讀取存檔。
Max Gil.button = 最大化
LevelTarget.label = 目標等級
LevelTarget.help = 用於「提升所有角色」。
Raise every character.label = 提升所有角色
Raise every character.help = 所有低於上方等級的角色，會透過遊戲本身設定EXP的功能獲得所需EXP。等級已較高的角色維持不變。
Raise every character.button = 提升
ItemCount.label = 消耗品數量
ItemCount.help = 用於「補齊所有消耗品」。
Stock every consumable.label = 補齊所有消耗品
Stock every consumable.help = 將所有消耗品（藥水、乙太等）設為上方的數量，包括尚未持有的消耗品。
Stock every consumable.button = 補齊
Get every artifact.label = 取得所有古遺物
Get every artifact.help = 加入所有尚未持有的完成版古遺物（遊戲檔案中未完成的古遺物不包含在內）。
Get every artifact.button = 取得
Max Mastery Rank.label = MASTERY RANK最大化
Max Mastery Rank.help = 所有角色對所有持有幻兵的MASTERY RANK皆提升至最大。
Max Mastery Rank.button = 最大化
Max awakening.label = 覺醒度最大化
Max awakening.help = 所有持有的幻兵皆完全覺醒。
Max awakening.button = 最大化
Libra on every enemy met.label = 對遇過的敵人使用窺伺探測
Libra on every enemy met.help = 所有遇過的敵人皆視為已使用窺伺探測，包括弱點，如同在戰鬥中探測過一般。
Libra on every enemy met.button = 探測
Restock shops.label = 商店補貨
Restock shops.help = 所有商店的限量商品恢復庫存。
Restock shops.button = 補貨
Reveal every map.label = 開啟所有地圖
Reveal every map.help = 地圖畫面顯示所有區域（僅限事件的關卡除外）。
Reveal every map.button = 開啟
header.General = 一般
Notices.label = 畫面訊息
Notices.help = 快捷鍵變更設定時顯示簡短訊息。
Reset everything.label = 全部重置
Reset everything.help = 將所有選項恢復為遊戲的正常數值。
Reset everything.button = 重置
header.Keys = 按鍵

