; FFR Trainer - French texts, translated from en.ini. Corrections welcome.

; --- name and settings ---
plugin.name = FFR Trainer
plugin.description = Triches et bonus : mode dieu, turbo, combat auto, récompenses, butins et vols, combats aléatoires et plus encore, qui reviennent à la normale quand vous les désactivez (ou le trainer). « Votre partie » modifie votre progression : gils, niveaux, objets, artéfacts, Visions, Acuité, boutiques et cartes.
header.Battle = Combat
GodMode.label = Mode dieu
GodMode.help = Les PV et PM du groupe restent au maximum et il ne subit aucun dégât. Raccourci : Ctrl+F1.
InfiniteHP.label = PV infinis
InfiniteHP.help = Les PV du groupe sont restaurés pendant les combats.
InfiniteMP.label = PM infinis
InfiniteMP.help = Les PM du groupe sont restaurés pendant les combats.
FullLimitBreak.label = Limite au maximum
FullLimitBreak.help = La jauge de Limite reste pleine.
LBGainMultiplier.label = Gain de Limite
LBGainMultiplier.help = Vitesse à laquelle la jauge de Limite se remplit.
KeepLimitBurst.label = Conserver la Limite
KeepLimitBurst.help = La jauge de Limite de chaque personnage est conservée d'un combat à l'autre.
MPCostPercent.label = Coût en PM
MPCostPercent.help = Coût en PM des compétences, en pourcentage du coût normal (arrondi au supérieur : seul 0 % les rend gratuites).
OneHitKill.label = Élimination en un coup
OneHitKill.help = Les ennemis tombent en un seul coup. Raccourci : Ctrl+F5.
Preset.label = Préréglage de difficulté
Preset.help = Règle d'un coup les cinq valeurs ci-dessous, en plus de la difficulté du jeu : Difficile se situe entre Normal et Expert, Cauchemar va bien au-delà d'Expert. Modifier l'une des cinq passe en Personnalisé.
Preset.choice.custom = Personnalisé
Preset.choice.normal = Normal
Preset.choice.hard = Difficile
Preset.choice.veryhard = Très difficile
Preset.choice.nightmare = Cauchemar
DamageDealtMultiplier.label = Dégâts infligés
DamageTakenMultiplier.label = Dégâts subis
EnemyHPMultiplier.label = PV des ennemis
EnemySpeedMultiplier.label = Vitesse des ennemis
EnemyBreakMultiplier.label = Jauge de choc des ennemis
EnemyBreakMultiplier.help = Taille de la jauge de choc des ennemis.
AlwaysEscape.label = Fuite assurée
AlwaysEscape.help = La fuite réussit toujours, sauf dans les combats où elle est impossible.
HealAfterBattle.label = Soins après combat
HealAfterBattle.help = Les PV et PM du groupe sont restaurés à la fin de chaque combat.
AutoBattle.label = Combat auto
AutoBattle.help = Les personnages utilisent seuls leur attaque de base. Attaquez d'abord une fois manuellement. Raccourci : Ctrl+F2.
AutoConfirmResults.label = Valider les résultats auto
AutoConfirmResults.help = Avec le combat auto, les écrans de résultats sont validés automatiquement.
header.Speed = Vitesse
TurboMultiplier.label = Turbo
TurboMultiplier.help = Accélère tout le jeu : terrain, combats et cinématiques. Raccourci : Ctrl+F6.
BattleSpeedMultiplier.label = Vitesse des combats
BattleSpeedMultiplier.help = Multiplie les paliers de vitesse des combats du jeu.
FieldSpeedMultiplier.label = Vitesse de marche
FieldSpeedMultiplier.help = Raccourci : Ctrl+F4.
header.Rewards = Récompenses
ExpMultiplier.label = EXP
GilMultiplier.label = Gils
MRPMultiplier.label = PRM
APMultiplier.label = PA
DropRateMultiplier.label = Taux de butin
AlwaysDropRare.label = Toujours obtenir le butin rare
AlwaysSteal.label = Vol toujours réussi
AlwaysStealRare.label = Vol de l'objet rare
RareEnemyMultiplier.label = Fréquence des ennemis rares
RareEnemyMultiplier.help = Fréquence d'apparition des Pampas, Gilkhélones et pots dans les combats aléatoires.
GilAmount.label = Gils à ajouter
GilAmount.choice.1000 = 1 000
GilAmount.choice.10000 = 10 000
GilAmount.choice.100000 = 100 000
GilAmount.choice.1000000 = 1 000 000
Add Gil.label = Ajouter des gils
Add Gil.help = Ajoute le montant ci-dessus à vos gils.
Add Gil.button = Ajouter
header.Abilities = Aptitudes
APCostPercent.label = Coût en PA des aptitudes
APCostPercent.help = Les PA nécessaires pour équiper aptitudes, passifs et compétences de maître, en pourcentage du coût normal. À 0 %, tout s'équipe gratuitement.
header.Shops = Boutiques
BuyPricePercent.label = Prix d'achat
BuyPricePercent.help = Ce que demandent les boutiques, en pourcentage du prix normal.
SellPricePercent.label = Prix de vente
SellPricePercent.help = Ce que les boutiques paient pour vos objets, en pourcentage du prix normal.
UnlimitedStock.label = Stock illimité
UnlimitedStock.help = Les objets vendus en quantité limitée peuvent être achetés sans limite.
header.Field = Terrain
Encounters.label = Combats aléatoires
Encounters.help = Raccourci : Ctrl+F3.
EncounterRate.label = Fréquence des combats
header.Your game = Votre partie
Heal party.label = Soigner le groupe
Heal party.help = Les PV et PM de chaque personnage reviennent au maximum, personnages K.O. compris, où que vous soyez.
Heal party.button = Soigner
Max Gil.label = Gils au maximum
Max Gil.help = Porte vos gils au maximum autorisé par le jeu (99 999 999). Comme tout ce qui figure dans cette section, la modification est immédiate et conservée lors de la sauvegarde ; chargez une sauvegarde sans sauvegarder pour l'annuler.
Max Gil.button = Max
LevelTarget.label = Niveau à atteindre
LevelTarget.help = Pour « Faire monter tous les personnages ».
Raise every character.label = Faire monter tous les personnages
Raise every character.help = Chaque personnage sous le niveau ci-dessus reçoit l'EXP nécessaire, via la fonction du jeu qui définit l'EXP. Les personnages de niveau supérieur ne changent pas.
Raise every character.button = Monter
ItemCount.label = Quantité de consommables
ItemCount.help = Pour « Remplir les consommables ».
Stock every consumable.label = Remplir les consommables
Stock every consumable.help = Chaque consommable (potions, éthers...) passe à la quantité ci-dessus, y compris ceux que vous n'avez pas encore.
Stock every consumable.button = Remplir
Get every artifact.label = Obtenir tous les artéfacts
Get every artifact.help = Ajoute tous les artéfacts finalisés que vous ne possédez pas encore (ceux inachevés présents dans les fichiers du jeu sont exclus).
Get every artifact.button = Obtenir
Max Mastery Rank.label = Rang de maîtrise au maximum
Max Mastery Rank.help = Le rang de maîtrise de chaque personnage avec chaque Vision que vous possédez passe au maximum.
Max Mastery Rank.button = Max
Max awakening.label = Éveil au maximum
Max awakening.help = Chaque Vision que vous possédez atteint le niveau d'éveil maximal.
Max awakening.button = Max
Libra on every enemy met.label = Acuité sur tous les ennemis rencontrés
Libra on every enemy met.help = Chaque ennemi rencontré est considéré comme analysé avec Acuité, faiblesses comprises, comme si vous l'aviez analysé en combat.
Libra on every enemy met.button = Analyser
Restock shops.label = Réapprovisionner les boutiques
Restock shops.help = Les objets en quantité limitée de chaque boutique sont de nouveau en stock.
Restock shops.button = Réapprovisionner
Reveal every map.label = Révéler toutes les cartes
Reveal every map.help = Chaque zone apparaît sur l'écran de la carte (les lieux réservés aux événements sont exclus).
Reveal every map.button = Révéler
header.General = Général
Notices.label = Messages à l'écran
Notices.help = Courts messages quand un raccourci modifie un réglage.
Reset everything.label = Tout réinitialiser
Reset everything.help = Rétablit les valeurs normales du jeu pour toutes les options.
Reset everything.button = Réinitialiser
header.Keys = Touches

