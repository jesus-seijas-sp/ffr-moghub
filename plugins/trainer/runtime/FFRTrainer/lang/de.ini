GilMultiplier.label = Gil
MRPMultiplier.label = MSP
APMultiplier.label = FP
DropRateMultiplier.label = Beuterate
AlwaysDropRare.label = Immer Belohnung+
AlwaysSteal.label = Stehlen gelingt immer
AlwaysStealRare.label = Stehlen bringt Stehlbares+
