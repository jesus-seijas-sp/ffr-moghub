Add Gil.help = Fügt deinem Gil den obigen Betrag hinzu.
Add Gil.button = Hinzufügen
header.Field = Feld
Encounters.label = Zufallsbegegnungen
Encounters.help = Tastenkürzel: Ctrl+F3.
EncounterRate.label = Begegnungsrate
header.Your game = Dein Spiel
Max Gil.label = Max. Gil
Max Gil.help = Setzt dein Gil auf das vom Spiel erlaubte Maximum (99.999.999). Wie alles in diesem Abschnitt ändert es dein Spiel sofort und bleibt beim Speichern erhalten; lade einen Spielstand, ohne zu speichern, um es rückgängig zu machen.
Max Gil.button = Max.
LevelTarget.label = Zielstufe
LevelTarget.help = Für „Alle Charaktere aufstufen“.
Raise every character.label = Alle Charaktere aufstufen
Raise every character.help = Jeder Charakter unter der obigen Stufe erhält die nötigen EP, über die spieleigene Funktion zum Setzen von EP. Charaktere mit höherer Stufe bleiben unverändert.
Raise every character.button = Aufstufen
ItemCount.label = Anzahl Mittel
ItemCount.help = Für „Alle Mittel auffüllen“.
Stock every consumable.label = Alle Mittel auffüllen
Stock every consumable.help = Jedes Mittel (Tränke, Äther, ...) wird auf die obige Anzahl gesetzt, auch die, die du noch nicht hast.
Stock every consumable.button = Auffüllen
Get every artifact.label = Alle Artefakte erhalten
Get every artifact.help = Fügt alle fertigen Artefakte hinzu, die du noch nicht besitzt (die unfertigen in den Spieldateien werden ausgelassen).
Get every artifact.button = Erhalten
Max Mastery Rank.label = Max. Meisterschaftsrang
Max Mastery Rank.help = Der Meisterschaftsrang jedes Charakters mit jeder Vision, die du besitzt, auf dem Maximum.
Max Mastery Rank.button = Max.
Max awakening.label = Max. Erwachensstufe
Max awakening.help = Jede Vision, die du besitzt, vollständig erweckt.
Max awakening.button = Max.
Libra on every enemy met.label = Analyse aller getroffenen Gegner
Libra on every enemy met.help = Jeder Gegner, dem du begegnet bist, gilt als mit Analyse untersucht, Schwächen eingeschlossen, als hättest du ihn im Kampf analysiert.
Libra on every enemy met.button = Analysieren
Restock shops.label = Läden auffüllen
Restock shops.help = Die begrenzten Waren in jedem Laden sind wieder vorrätig.
Restock shops.button = Auffüllen
Reveal every map.label = Alle Karten aufdecken
Reveal every map.help = Jedes Gebiet wird auf dem Kartenbildschirm angezeigt (reine Ereignis-Schauplätze ausgenommen).
Reveal every map.button = Aufdecken
header.General = Allgemein
Notices.label = Bildschirmmeldungen
Notices.help = Kurze Meldungen, wenn ein Tastenkürzel etwas ändert.
Reset everything.label = Alles zurücksetzen
Reset everything.help = Setzt alle Optionen auf die normalen Werte des Spiels zurück.
Reset everything.button = Zurücksetzen
