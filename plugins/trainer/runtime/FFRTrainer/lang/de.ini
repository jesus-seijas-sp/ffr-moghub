; FFR Trainer - German texts, translated from en.ini. Corrections welcome.

; --- name and settings ---
plugin.name = FFR Trainer
plugin.description = Cheats und Verstärker: Gottmodus, Turbo, automatischer Kampf, Belohnungen, Beute und Stehlen, Zufallsbegegnungen und mehr; alles wird wieder normal, wenn du es (oder den Trainer) ausschaltest. „Dein Spiel“ ändert deinen Fortschritt: Gil, Stufen, Gegenstände, Artefakte, Visionen, Analyse, Läden und Karten.
header.Battle = Kampf
GodMode.label = Gottmodus
GodMode.help = LP und MP der Gruppe bleiben voll, und sie erleidet keinen Schaden. Tastenkürzel: Ctrl+F1.
InfiniteHP.label = Unendlich LP
InfiniteHP.help = Die LP der Gruppe werden im Kampf aufgefüllt.
InfiniteMP.label = Unendlich MP
InfiniteMP.help = Die MP der Gruppe werden im Kampf aufgefüllt.
FullLimitBreak.label = Voller Limitrausch
FullLimitBreak.help = Die Limitrausch-Leiste bleibt voll.
NoMPCost.label = Keine MP-Kosten
NoMPCost.help = Fähigkeiten kosten keine MP.
OneHitKill.label = Sofort besiegen
OneHitKill.help = Gegner fallen mit einem Treffer. Tastenkürzel: Ctrl+F5.
DamageDealtMultiplier.label = Verursachter Schaden
DamageTakenMultiplier.label = Erlittener Schaden
EnemyHPMultiplier.label = Gegner-LP
EnemySpeedMultiplier.label = Gegner-Tempo
EnemyBreakMultiplier.label = Gegner-Schockleiste
EnemyBreakMultiplier.help = Wie viel Schockleiste die Gegner haben.
AlwaysEscape.label = Immer fliehen
AlwaysEscape.help = Fliehen gelingt immer, außer in Kämpfen, aus denen man nicht fliehen kann.
HealAfterBattle.label = Heilen nach dem Kampf
HealAfterBattle.help = LP und MP der Gruppe werden am Ende eines Kampfes aufgefüllt.
AutoBattle.label = Automatischer Kampf
AutoBattle.help = Die Charaktere setzen von selbst ihren normalen Angriff ein. Greife zuerst einmal von Hand an. Tastenkürzel: Ctrl+F2.
AutoConfirmResults.label = Ergebnisse automatisch bestätigen
AutoConfirmResults.help = Bei automatischem Kampf werden die Ergebnisbildschirme für dich bestätigt.
header.Speed = Tempo
TurboMultiplier.label = Turbo
TurboMultiplier.help = Beschleunigt das ganze Spiel: Feld, Kämpfe und Zwischensequenzen. Tastenkürzel: Ctrl+F6.
BattleSpeedMultiplier.label = Kampftempo
BattleSpeedMultiplier.help = Skaliert die Kampftempo-Stufen des Spiels.
FieldSpeedMultiplier.label = Lauftempo
FieldSpeedMultiplier.help = Tastenkürzel: Ctrl+F4.
