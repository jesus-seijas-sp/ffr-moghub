; FFR Trainer - Spanish texts, translated from en.ini. Corrections welcome.

; --- name and settings ---
plugin.name = FFR Trainer
plugin.description = Trucos y potenciadores: modo dios, turbo, batalla automática, recompensas, botín y robos, encuentros y más, que vuelven a la normalidad al desactivarlos (o al desactivar el trainer). «Tu partida» modifica tu progreso: guiles, niveles, objetos, artefactos, Visiones, Libra, mercaderes y mapas.
header.Battle = Batalla
GodMode.label = Modo dios
GodMode.help = Los VIT y PM del grupo se mantienen al máximo y el daño que recibe es 0. Atajo: Ctrl+F1.
InfiniteHP.label = VIT infinitos
InfiniteHP.help = Los VIT del grupo se recuperan durante la batalla.
InfiniteMP.label = PM infinitos
InfiniteMP.help = Los PM del grupo se recuperan durante la batalla.
FullLimitBreak.label = Estallido límite lleno
FullLimitBreak.help = La barra de Estallido límite se mantiene llena.
NoMPCost.label = Sin coste de PM
NoMPCost.help = Las habilidades no cuestan PM.
OneHitKill.label = Derrotas de un golpe
OneHitKill.help = Los enemigos caen de un solo golpe. Atajo: Ctrl+F5.
DamageDealtMultiplier.label = Daño infligido
DamageTakenMultiplier.label = Daño recibido
EnemyHPMultiplier.label = VIT de los enemigos
EnemySpeedMultiplier.label = Velocidad de los enemigos
EnemyBreakMultiplier.label = Barra de aturdimiento enemiga
EnemyBreakMultiplier.help = Cuánta barra de aturdimiento tienen los enemigos.
AlwaysEscape.label = Huir siempre
AlwaysEscape.help = Huir siempre funciona, salvo en las batallas de las que no se puede huir.
HealAfterBattle.label = Curar tras la batalla
HealAfterBattle.help = Los VIT y PM del grupo se recuperan al terminar una batalla.
AutoBattle.label = Batalla automática
AutoBattle.help = Los personajes usan su ataque básico por su cuenta. Antes, ataca una vez a mano. Atajo: Ctrl+F2.
AutoConfirmResults.label = Confirmar resultados
AutoConfirmResults.help = Con la batalla automática activada, las pantallas de resultados se confirman solas.
header.Speed = Velocidad
TurboMultiplier.label = Turbo
TurboMultiplier.help = Acelera todo el juego: campo, batallas y escenas. Atajo: Ctrl+F6.
BattleSpeedMultiplier.label = Velocidad de combate
BattleSpeedMultiplier.help = Multiplica los niveles de velocidad de combate del propio juego.
FieldSpeedMultiplier.label = Velocidad al caminar
FieldSpeedMultiplier.help = Atajo: Ctrl+F4.
header.Rewards = Recompensas
ExpMultiplier.label = EXP
GilMultiplier.label = Guiles
MRPMultiplier.label = PD
APMultiplier.label = PH
DropRateMultiplier.label = Probabilidad de botín
AlwaysDropRare.label = Botín raro siempre
AlwaysSteal.label = Robar siempre funciona
AlwaysStealRare.label = Robar da el objeto raro
GilAmount.label = Guiles que añadir
GilAmount.choice.1000 = 1.000
GilAmount.choice.10000 = 10.000
GilAmount.choice.100000 = 100.000
GilAmount.choice.1000000 = 1.000.000
Add Gil.label = Añadir guiles
Add Gil.help = Añade la cantidad de arriba a tus guiles.
Add Gil.button = Añadir
header.Field = Campo
Encounters.label = Encuentros
Encounters.help = Atajo: Ctrl+F3.
EncounterRate.label = Frecuencia de encuentros
header.Your game = Tu partida
Max Gil.label = Guiles al máximo
Max Gil.help = Pone tus guiles en el máximo que permite el juego (99.999.999). Como todo en esta sección, cambia tu partida al momento y se conserva al guardar; carga una partida sin guardar para deshacerlo.
Max Gil.button = Máximo
LevelTarget.label = Nivel objetivo
LevelTarget.help = Para «Subir a todos los personajes».
Raise every character.label = Subir a todos los personajes
Raise every character.help = Cada personaje por debajo del nivel de arriba recibe la EXP necesaria, mediante la propia función del juego para asignar EXP. Los personajes que ya tengan más nivel se quedan como están.
Raise every character.button = Subir
ItemCount.label = Cantidad de consumibles
ItemCount.help = Para «Rellenar todos los consumibles».
Stock every consumable.label = Rellenar todos los consumibles
Stock every consumable.help = Todos los consumibles (pociones, éteres...) pasan a la cantidad de arriba, también los que aún no tienes.
Stock every consumable.button = Rellenar
Get every artifact.label = Obtener todos los artefactos
Get every artifact.help = Añade todos los artefactos terminados que aún no tienes (se excluyen los inacabados de los archivos del juego).
Get every artifact.button = Obtener
Max Mastery Rank.label = Rango de dominio al máximo
Max Mastery Rank.help = El rango de dominio de cada personaje con cada Visión que tienes, al máximo.
Max Mastery Rank.button = Máximo
Max awakening.label = Despertar al máximo
Max awakening.help = Todas las Visiones que tienes, con el despertar completo.
Max awakening.button = Máximo
Libra on every enemy met.label = Libra en los enemigos encontrados
Libra on every enemy met.help = Todos los enemigos que has encontrado cuentan como analizados con Libra, debilidades incluidas, como si los hubieras analizado en batalla.
Libra on every enemy met.button = Analizar
Restock shops.label = Reponer mercaderes
Restock shops.help = Los objetos limitados de todos los mercaderes vuelven a estar disponibles.
Restock shops.button = Reponer
Reveal every map.label = Revelar todos los mapas
Reveal every map.help = Todas las zonas aparecen en la pantalla del mapa (salvo los escenarios exclusivos de eventos).
Reveal every map.button = Revelar
header.General = General
Notices.label = Mensajes en pantalla
Notices.help = Mensajes breves cuando un atajo cambia algo.
Reset everything.label = Restablecer todo
Reset everything.help = Devuelve todas las opciones a los valores normales del juego.
Reset everything.button = Restablecer
