; --- name and settings ---
plugin.name = FFR Trainer
plugin.description = Cheats and boosters: god mode, turbo, auto battle, rewards, drops and steals, encounters and more, which go back to normal when you switch them (or the trainer) off. "Your game" edits your progress: Gil, levels, items, artifacts, visions, Libra, shops and maps.
header.Battle = Battle
GodMode.label = God mode
GodMode.help = Party HP and MP stay full and the damage they take is 0. Hotkey: Ctrl+F1.
InfiniteHP.label = Infinite HP
InfiniteHP.help = The party's HP is refilled during battle.
InfiniteMP.label = Infinite MP
InfiniteMP.help = The party's MP is refilled during battle.
FullLimitBreak.label = Full Limit Burst
FullLimitBreak.help = The Limit Burst gauge stays full.
NoMPCost.label = No MP cost
NoMPCost.help = Skills cost no MP.
OneHitKill.label = One-hit kills
OneHitKill.help = Enemies go down in one hit. Hotkey: Ctrl+F5.
DamageDealtMultiplier.label = Damage dealt
DamageTakenMultiplier.label = Damage taken
EnemyHPMultiplier.label = Enemy HP
EnemySpeedMultiplier.label = Enemy speed
EnemyBreakMultiplier.label = Enemy break gauge
EnemyBreakMultiplier.help = How much break gauge enemies have.
AlwaysEscape.label = Always escape
AlwaysEscape.help = Running away always works, except in battles that can't be escaped.
HealAfterBattle.label = Heal after battle
HealAfterBattle.help = The party's HP and MP are refilled when a battle ends.
AutoBattle.label = Auto battle
AutoBattle.help = Characters use their basic attack on their own. Attack once by hand first. Hotkey: Ctrl+F2.
AutoConfirmResults.label = Auto-confirm results
AutoConfirmResults.help = With auto battle on, the result screens are confirmed for you.
header.Speed = Speed
TurboMultiplier.label = Turbo
TurboMultiplier.help = Speeds up the whole game: field, battles and cutscenes. Hotkey: Ctrl+F6.
BattleSpeedMultiplier.label = Battle speed
BattleSpeedMultiplier.help = Scales the game's own battle speed steps.
FieldSpeedMultiplier.label = Walking speed
FieldSpeedMultiplier.help = Hotkey: Ctrl+F4.
header.Rewards = Rewards
ExpMultiplier.label = EXP
GilMultiplier.label = Gil
MRPMultiplier.label = MRP
APMultiplier.label = AP
DropRateMultiplier.label = Drop rate
AlwaysDropRare.label = Always drop rare items
AlwaysSteal.label = Steals always work
AlwaysStealRare.label = Steals give the rare item
GilAmount.label = Gil to add
GilAmount.choice.1000 = 1,000
GilAmount.choice.10000 = 10,000
GilAmount.choice.100000 = 100,000
GilAmount.choice.1000000 = 1,000,000
Add Gil.label = Add Gil
Add Gil.help = Adds the amount above to your Gil.
Add Gil.button = Add
header.Field = Field
Encounters.label = Random encounters
Encounters.help = Hotkey: Ctrl+F3.
EncounterRate.label = Encounter rate
header.Your game = Your game
Max Gil.label = Max Gil
Max Gil.help = Sets your Gil to the most the game allows (99,999,999). Like everything in this section, it changes your game right away and is kept when you save; load a save without saving to undo it.
Max Gil.button = Max
LevelTarget.label = Level to raise to
LevelTarget.help = For "Raise every character".
Raise every character.label = Raise every character
Raise every character.help = Every character below the level above gets the EXP for it, through the game's own function for setting EXP. Characters already higher stay as they are.
Raise every character.button = Raise
ItemCount.label = Consumables count
ItemCount.help = For "Stock every consumable".
Stock every consumable.label = Stock every consumable
Stock every consumable.help = Every consumable (potions, ethers, ...) set to the count above, also the ones you don't have yet.
Stock every consumable.button = Stock
Get every artifact.label = Get every artifact
Get every artifact.help = Adds every finished artifact you don't own yet (the unfinished ones in the game files are left out).
Get every artifact.button = Get
Max Mastery Rank.label = Max Mastery Rank
Max Mastery Rank.help = Every character's Mastery Rank with every vision you own, at the maximum.
Max Mastery Rank.button = Max
Max awakening.label = Max awakening
Max awakening.help = Every vision you own, fully awakened.
Max awakening.button = Max
Libra on every enemy met.label = Libra on every enemy met
Libra on every enemy met.help = Every enemy you have met counts as scanned with Libra, weaknesses included, as if you had scanned it in battle.
Libra on every enemy met.button = Scan
Restock shops.label = Restock shops
Restock shops.help = The limited items in every shop are back in stock.
Restock shops.button = Restock
Reveal every map.label = Reveal every map
Reveal every map.help = Every area shows on the map screen (event-only stages left out).
Reveal every map.button = Reveal
header.General = General
Notices.label = On-screen messages
Notices.help = Short messages when a hotkey changes something.
Reset everything.label = Reset everything
Reset everything.help = Puts every option back to the game's normal values.
Reset everything.button = Reset
header.Keys = Keys

